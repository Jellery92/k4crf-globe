 .polygonsData(WORLD.features).polygonSideColor(()=>'rgba(5,18,33,.45)').polygonStrokeColor(()=>'rgba(91,143,181,.28)')
 .polygonLabel(d=>d.properties.kind==='state'?`<b>${d.properties.name}</b><br>${byState.get(d.properties.code)?.count||0} QSOs`:`<b>${normalizeCountryName(d.properties.name)}</b>`)
 .pointAltitude(d=>d.home ? .12 : .04+Math.min(.08,Math.log10(d.count+1)*.025)).pointRadius(d=>d.home?.42:.12+Math.min(.18,Math.log10(d.count+1)*.055)).pointResolution(16)
 .pointColor(d=>d.home?'#ffffff':'#54d8ff').pointLabel(d=>d.home?'<b>K4CRF</b><br>Fayetteville, North Carolina':`<b>${d.label||d.country||d.name}</b><br>${d.count} QSO${d.count===1?'':'s'}`)
 .arcColor(()=>['rgba(66,202,255,.22)','rgba(74,218,255,.92)']).arcAltitudeAutoScale(.22).arcStroke(.35).arcDashLength(.35).arcDashGap(.7).arcDashAnimateTime(4800)
 .ringColor(()=>t=>`rgba(77,212,255,${1-t})`).ringMaxRadius(3.6).ringPropagationSpeed(1.2).ringRepeatPeriod(1300)
 .labelText(d=>d.text).labelColor(()=>'#dff7ff').labelDotRadius(.18).labelAltitude(.08).labelSize(.72).labelResolution(2)
 .onPolygonClick(d=>handlePolygonClick(d));
globe.globeMaterial().color.set('#061429');globe.globeMaterial().emissive.set('#020b17');globe.globeMaterial().emissiveIntensity=.55;
globe.controls().autoRotate=true;globe.controls().autoRotateSpeed=.34;globe.controls().enableDamping=true;globe.pointOfView({lat:24,lng:-30,altitude:2.2},0);

function stopRotation(){globe.controls().autoRotate=false;$('rotate').checked=false}
function currentRecords(){const band=$('band').value,mode=$('mode').value;return RECORDS.filter(r=>(band==='ALL'||r.band===band)&&(mode==='ALL'||r.mode===mode))}
function aggregateCountries(records){const m=new Map();for(const r of records){if(!m.has(r.country))m.set(r.country,{country:r.country,count:0,confirmed_count:0,unconfirmed_count:0,calls:new Set(),bands:{},first:r.date,last:r.date,coords:[]});const x=m.get(r.country);x.count++;r.confirmed?x.confirmed_count++:x.unconfirmed_count++;if(r.call)x.calls.add(r.call);if(r.band)x.bands[r.band]=(x.bands[r.band]||0)+1;if(r.date<x.first)x.first=r.date;if(r.date>x.last)x.last=r.date;if(r.lat!==null&&r.lon!==null)x.coords.push([r.lat,r.lon])}return[...m.values()].map(x=>{const base=byCountry.get(x.country)||{};let lat=base.lat||0,lon=base.lon||0;if(x.coords.length){const a=x.coords.map(p=>p[0]).sort((a,b)=>a-b),b=x.coords.map(p=>p[1]).sort((a,b)=>a-b);lat=a[Math.floor(a.length/2)];lon=b[Math.floor(b.length/2)]}return{...x,calls:[...x.calls].sort(),lat,lon}}).sort((a,b)=>b.count-a.count||a.country.localeCompare(b.country))}
function aggregateStates(records){const m=new Map();for(const r of records){if(!r.state||!STATE_NAMES[r.state])continue;if(!m.has(r.state))m.set(r.state,{code:r.state,name:STATE_NAMES[r.state],count:0,confirmed_count:0,unconfirmed_count:0,calls:new Set(),bands:{},first:r.date,last:r.date,coords:[]});const x=m.get(r.state);x.count++;r.confirmed?x.confirmed_count++:x.unconfirmed_count++;if(r.call)x.calls.add(r.call);if(r.band)x.bands[r.band]=(x.bands[r.band]||0)+1;if(r.date<x.first)x.first=r.date;if(r.date>x.last)x.last=r.date;if(r.lat!==null&&r.lon!==null)x.coords.push([r.lat,r.lon])}return[...m.values()].map(x=>{const base=byState.get(x.code)||{};let lat=base.lat||0,lon=base.lon||0;if(x.coords.length){const a=x.coords.map(p=>p[0]).sort((a,b)=>a-b),b=x.coords.map(p=>p[1]).sort((a,b)=>a-b);lat=a[Math.floor(a.length/2)];lon=b[Math.floor(b.length/2)]}return{...x,calls:[...x.calls].sort(),lat,lon}}).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name))}

async function ensureStates(){if(stateFeatures)return stateFeatures;$('status').textContent='Loading U.S. state boundaries…';const res=await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json');if(!res.ok)throw new Error('State boundary download failed');const topo=await res.json();const fc=topojson.feature(topo,topo.objects.states);stateFeatures=fc.features.map(f=>{const code=STATE_FIPS[String(f.id).padStart(2,'0')];if(!code)return null;f.properties={kind:'state',code,name:STATE_NAMES[code]};return f}).filter(Boolean);$('status').textContent='';return stateFeatures}
async function setPolygonDataset(){if($('states').checked){try{const states=await ensureStates();const countries=WORLD.features.filter(f=>normalizeCountryName(f.properties.name)!=='United States');globe.polygonsData([...countries,...states])}catch(e){$('states').checked=false;$('status').textContent='Could not load state boundaries. Check the internet connection.';globe.polygonsData(WORLD.features)}}else globe.polygonsData(WORLD.features);update()}

function applyPolygonStyles(countryMap,stateMap){const stateMode=$('states').checked;const maxCountry=Math.max(1,...[...countryMap.values()].map(x=>x.count),1),maxState=Math.max(1,...[...stateMap.values()].map(x=>x.count),1);globe.polygonCapColor(d=>{if(d.properties.kind==='state'){const x=stateMap.get(d.properties.code);if(!x)return'rgba(10,30,48,.38)';const a=.28+.56*Math.sqrt(x.count/maxState);return x.confirmed_count>0?`rgba(47,224,111,${a})`:`rgba(255,210,74,${a})`}if(stateMode)return'rgba(10,30,48,.38)';const x=countryMap.get(normalizeCountryName(d.properties.name));if(!x)return'rgba(10,30,48,.38)';const a=.28+.56*Math.sqrt(x.count/maxCountry);return x.confirmed_count>0?`rgba(47,224,111,${a})`:`rgba(255,210,74,${a})`});globe.polygonStrokeColor(d=>{if(d.properties.kind==='state')return selectedState===d.properties.code?'rgba(255,255,255,.98)':'rgba(91,143,181,.45)';const n=normalizeCountryName(d.properties.name);return selectedCountry===n?'rgba(255,255,255,.98)':'rgba(91,143,181,.20)'});globe.polygonAltitude(d=>d.properties.kind==='state'?(selectedState===d.properties.code ? .025 : .005):(selectedCountry===normalizeCountryName(d.properties.name) ? .02 : .004));globe.polygonSideColor(d=>d.properties.kind==='state'?(selectedState===d.properties.code?'rgba(255,255,255,.16)':'rgba(5,18,33,.45)'):(selectedCountry===normalizeCountryName(d.properties.name)?'rgba(255,255,255,.15)':'rgba(5,18,33,.45)'))}

function buildHtmlMarkers(recs){const markers=[];if($('points').checked)markers.push(...recs.filter(r=>r.lat!==null&&r.lon!==null).map(r=>({kind:'qso',...r})));return markers}
function renderHtmlMarkers(recs){const markers=buildHtmlMarkers(recs);globe.htmlElementsData(markers).htmlElement(d=>{const el=document.createElement('div');el.title=`${d.call} • ${d.country} • ${d.band} ${d.mode}`;el.style.cssText='width:3px;height:3px;border-radius:50%;background:#b9f3ff;box-shadow:0 0 5px #45cbff;opacity:.8;pointer-events:none';return el}).htmlAltitude(.012)}
function updateRings(){globe.ringsData([{lat:HOME.lat,lng:HOME.lon}])}

function update(){const recs=currentRecords(),countries=aggregateCountries(recs),states=aggregateStates(recs),countryMap=new Map(countries.map(x=>[x.country,x])),stateMap=new Map(states.map(x=>[x.code,x]));applyPolygonStyles(countryMap,stateMap);const stateMode=$('states').checked;const points=stateMode?[]:countries.map(x=>({...x,label:x.country}));points.push({home:true,lat:HOME.lat,lon:HOME.lon,count:1,label:'K4CRF'});globe.pointsData(points);globe.labelsData([{lat:HOME.lat,lon:HOME.lon,text:'K4CRF'}]);const routeTargets=stateMode?states:countries.filter(x=>x.country!=='United States');globe.arcsData($('routes').checked?routeTargets.map(x=>({startLat:HOME.lat,startLng:HOME.lon,endLat:x.lat,endLng:x.lon})):[]);renderHtmlMarkers(recs);updateRings();stateMode?renderStateList(states):renderCountryList(countries)}

function badgeStyle(x){return`background:${x.confirmed_count>0?'rgba(47,224,111,.13)':'rgba(255,210,74,.13)'};border:1px solid ${x.confirmed_count>0?'rgba(47,224,111,.35)':'rgba(255,210,74,.35)'};color:${x.confirmed_count>0?'#d9ffe5':'#fff2b6'}`}
function renderCountryList(items){$('listTitle').textContent='Worked countries';const q=$('search').value.trim().toLowerCase(),filtered=items.filter(x=>!q||x.country.toLowerCase().includes(q)||x.calls.some(c=>c.toLowerCase().includes(q)));$('countryList').innerHTML=filtered.length?filtered.map(x=>`<button class="country ${selectedCountry===x.country?'active':''}" data-country="${escapeHtml(x.country)}"><div><div class="c-name">${escapeHtml(x.country)}</div><div class="c-meta">${x.calls.length} callsign${x.calls.length===1?'':'s'} • ${x.last} • ${x.confirmed_count>0?'Confirmed':'Unconfirmed'}</div></div><span class="badge" style="${badgeStyle(x)}">${x.count}</span></button>`).join(''):'<div class="empty">No matches</div>';document.querySelectorAll('[data-country]').forEach(b=>b.addEventListener('click',()=>selectCountry(b.dataset.country,items)));$('filteredCount').textContent=`${items.length} / ${currentRecords().length.toLocaleString()} QSOs`}
function renderStateList(items){$('listTitle').textContent='Worked U.S. states';const q=$('search').value.trim().toLowerCase(),filtered=items.filter(x=>!q||x.name.toLowerCase().includes(q)||x.code.toLowerCase().includes(q)||x.calls.some(c=>c.toLowerCase().includes(q)));$('countryList').innerHTML=filtered.length?filtered.map(x=>`<button class="country ${selectedState===x.code?'active':''}" data-state="${x.code}"><div><div class="c-name">${x.name} (${x.code})</div><div class="c-meta">${x.calls.length} callsign${x.calls.length===1?'':'s'} • ${x.last} • ${x.confirmed_count>0?'Confirmed':'Unconfirmed'}</div></div><span class="badge" style="${badgeStyle(x)}">${x.count}</span></button>`).join(''):'<div class="empty">No matches</div>';document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>selectState(b.dataset.state,items)));$('filteredCount').textContent=`${items.length} states / ${items.reduce((n,x)=>n+x.count,0).toLocaleString()} QSOs`}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function detailFor(x,title){const bands=Object.entries(x.bands||{}).sort((a,b)=>b[1]-a[1]).map(([b,n])=>`${b}: ${n}`).join(' • ');$('detail').className='detail show';$('detail').innerHTML=`<h2>${escapeHtml(title)}</h2><p><b>${x.count}</b> QSOs • ${x.first} to ${x.last}</p><p><b style="color:${x.confirmed_count>0?'#7dffab':'#ffe277'}">${x.confirmed_count}</b> confirmed • <b>${x.unconfirmed_count}</b> unconfirmed</p><p>${bands}</p><div class="calls">${x.calls.map(escapeHtml).join(' • ')}</div>`}
function selectCountry(name,items){const x=items.find(v=>v.country===name)||byCountry.get(name);if(!x)return;selectedCountry=name;selectedState=null;stopRotation();globe.pointOfView({lat:x.lat,lng:x.lon,altitude:1.45},900);detailFor(x,name);update()}
function selectState(code,items){const x=items.find(v=>v.code===code)||byState.get(code);if(!x)return;selectedState=code;selectedCountry=null;stopRotation();globe.pointOfView({lat:x.lat,lng:x.lon,altitude:1.25},900);detailFor(x,`${x.name} (${code})`);update()}
function handlePolygonClick(d){if(d.properties.kind==='state'&&$('states').checked){selectState(d.properties.code,aggregateStates(currentRecords()));return}if(!$('states').checked){const name=normalizeCountryName(d.properties.name),items=aggregateCountries(currentRecords());if(items.some(v=>v.country===name))selectCountry(name,items)}}
$('band').addEventListener('change',update);$('mode').addEventListener('change',update);$('routes').addEventListener('change',update);$('points').addEventListener('change',update);$('rotate').addEventListener('change',e=>globe.controls().autoRotate=e.target.checked);$('search').addEventListener('input',update);
$('states').addEventListener('change',async()=>{selectedCountry=selectedState=null;$('detail').className='detail';await setPolygonDataset()});

function resize(){globe.width($('globe').clientWidth).height($('globe').clientHeight)}window.addEventListener('resize',resize);setTimeout(resize,50);update();
</script>
</body></html>
